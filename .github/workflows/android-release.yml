# Build the signed Android release (AAB for Play + universal APK for direct
# sideloading) and, when the Play service-account secret is configured,
# upload the AAB to the Play INTERNAL testing track — the Android twin of
# ios-testflight.yml.
#
# INTERNAL BY DEFAULT (owner decision 2026-09, after the first Play
# release): every run lands on the internal track; promoting a build to
# closed (alpha) / open (beta) testing or production is a deliberate step
# the owner takes in Play Console ("Promote release" keeps the same build).
# The `track` input can aim a run straight at alpha/beta instead — the
# 2026-08 closed test fed alpha this way — but the wrapper and a tag push
# never set it, so a release always stops at internal.
#
# Runs on MANUAL DISPATCH ONLY (Actions → Android release → Run workflow).
# Automatic publishing on every main push is PAUSED (owner request, 2026-08);
# the commented-out push trigger below — including its hard-won paths-ignore
# rationale — is kept intact so resuming is just uncommenting it. Note the
# pause also stops the sideload APK on GitHub Pages (app/pegasus.apk) from
# auto-refreshing — a manual run updates it.
#
# Required repository secrets (signing):
#   ANDROID_KEYSTORE_BASE64     the upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias inside the keystore
#   ANDROID_KEY_PASSWORD        key password
# Optional (Play upload — until it exists, the workflow just attaches the
# signed artifacts and skips the upload step):
#   PLAY_SERVICE_ACCOUNT_JSON   a Google Cloud service-account JSON key with
#                               release access in Play Console → API access
#
# versionCode = the workflow run number (monotonic); versionName = the
# release tag (tools/version.sh --marketing — the run FAILS on an untagged
# history: a store release is cut from a tagged main, see CLAUDE.md
# "Versioning"). NOTE: the very first AAB must be
# uploaded to Play Console manually (Google requirement) — grab it from
# this workflow's artifacts.
name: Android release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to (internal = default; alpha = closed testing, beta = open testing)"
        type: choice
        options: [internal, alpha, beta]
        default: internal
  # Push trigger PAUSED — restore by uncommenting this block verbatim.
  # push:
  #   branches: [main]
  #   # INVERTED ON PURPOSE — see the twin comment in ios-testflight.yml. The
  #   # app bundles the whole web build, so android/ is only the SHELL and a
  #   # game change alters what ships to a device. An allowlist has to be
  #   # remembered every time a file is added; this fails OPEN, so the worst
  #   # case is a wasted build rather than a silently stale app.
  #   paths-ignore:
  #     - "docs/**"
  #     - "tests/**"
  #     - "**.md"
  #     # Workflows that cannot change what lands on a device. NOT the whole
  #     # of .github/: this workflow's OWN file must stay unignored so a fix
  #     # to it is exercised by the next merge — that is how this workflow's
  #     # `secrets in step if:` fix was verified (03e67a8, a commit
  #     # touching nothing else). Forgetting to list a NEW workflow
  #     # here costs one wasted build, which is the safe direction.
  #     - ".github/workflows/ci.yml"
  #     - ".github/workflows/deploy.yml"
  #     - ".github/workflows/preview-*.yml"
  #     - ".github/workflows/publish-pages.yml"
  #     - ".github/workflows/ios-*.yml"
  #     - ".github/workflows/android-build.yml"
  #     - ".github/workflows/android-test-apk.yml"
  #     - ".github/workflows/release-apps.yml"
  #     - ".github/actions/**"

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write # push the APK into the gh-pages state branch
  actions: write # dispatch publish-pages.yml after the sync (see that step)
  id-token: write # sign the provenance attestation (Sigstore, via GitHub's OIDC)
  attestations: write # store it in the repo's attestation registry

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PEGASUS_VERSION_CODE: ${{ github.run_number }}
      PEGASUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PEGASUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PEGASUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # The secrets context is not allowed in step `if:` expressions —
      # route the presence check through env instead.
      HAS_PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Check secrets
        run: |
          missing=0
          for v in PEGASUS_KEYSTORE_PASSWORD PEGASUS_KEY_ALIAS PEGASUS_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::missing secret behind $v"; missing=1; fi
          done
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::missing secret ANDROID_KEYSTORE_BASE64"; missing=1
          fi
          exit $missing

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Derive the marketing version from the release tag
        run: echo "PEGASUS_VERSION_NAME=$(tools/version.sh --marketing)" >> "$GITHUB_ENV"

      - name: Assemble webroot
        env:
          # The same backend config the web deploy writes — bundled, not
          # fetched from the live site, so the build is reproducible from
          # (commit, config); see the script.
          PEGASUS_BACKEND_CONFIG: ${{ vars.BACKEND_CONFIG_JSON }}
        run: ./android/sync-web.sh

      - name: Write keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "PEGASUS_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB + APK
        run: gradle -p android bundleRelease assembleRelease

      # Provenance (#214 step 7): a signed statement that these exact bytes
      # came out of this run of this workflow at this commit. Play re-signs
      # the AAB, so what a phone installs from the store is not verifiable
      # bytes — but the sideload APK is served as built:
      #   curl -fsSLO https://pegasusmoonlander.com/app/pegasus.apk
      #   gh attestation verify pegasus.apk --repo dannyrhubarb/pegasus
      # prints the workflow, commit and run that built it (see
      # android/README.md "Verifying a build").
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk

      # mapping.txt = the R8 deobfuscation map for THIS build number. Play
      # reads the copy AGP embeds in the AAB (BUNDLE-METADATA/…/proguard.map),
      # so nothing uploads it separately; it rides the artifact so a crash
      # trace from the sideload APK (same map — one R8 run feeds both) can be
      # retraced by hand: `retrace mapping.txt trace.txt`.
      - uses: actions/upload-artifact@v7
        with:
          name: pegasus-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      # Publish the signed APK for direct download at
      # https://pegasusmoonlander.com/app/pegasus.apk — the app/ subdir
      # of the gh-pages state branch survives main deploys (sync-pages-branch
      # keeps it like pr-*), and publish-pages.yml lists this workflow so the
      # push actually deploys.
      - name: Publish APK to GitHub Pages
        run: |
          mkdir -p pages-app
          cp android/app/build/outputs/apk/release/app-release.apk pages-app/pegasus.apk

      - uses: ./.github/actions/sync-pages-branch
        with:
          subdir: app
          source-dir: pages-app
          message: "Android APK build ${{ github.run_number }}"

      # publish-pages.yml's workflow_run trigger does NOT fire when this run
      # was itself dispatched with GITHUB_TOKEN (the release-apps wrapper) —
      # the recursion-guard exemption covers the workflow_dispatch, not the
      # dispatched run's downstream events — so the synced APK sat on the
      # branch undeployed (seen on three Release-apps runs, 2026-08). An
      # explicit dispatch is exempt again, so trigger the publish directly;
      # on a human-dispatched run this doubles with the workflow_run path,
      # which publish-pages' `pages` concurrency group collapses.
      - name: Trigger Pages publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-pages.yml --ref "$GITHUB_REF_NAME"

      - name: Upload to Play track
        if: ${{ env.HAS_PLAY_JSON == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: se.danielfalk.pegasus
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          # Internal unless the dispatch form says otherwise (see the header);
          # the `||` covers a dispatch that carries no inputs at all.
          tracks: ${{ inputs.track || 'internal' }}
          status: completed

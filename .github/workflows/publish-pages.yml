name: Publish Pages

# The ONLY workflow that actually deploys to GitHub Pages. It snapshots the
# gh-pages state branch (root = main build, pr-<n>/ = live previews) and
# publishes the whole tree as the Pages artifact.
#
# Why the indirection: the auto-created `github-pages` environment only allows
# deployments from `main`, so a pull_request-triggered workflow can't call
# deploy-pages itself. `workflow_run` workflows always execute from the default
# branch, so this passes the environment protection for previews and main
# alike — no repo settings changes needed. Keep Settings → Pages → Source on
# "GitHub Actions".
#
# The workflow names below must match the `name:` of deploy.yml,
# preview-deploy.yml, preview-teardown.yml, android-release.yml and
# android-test-apk.yml exactly (the Android release pushes the APK into the
# branch's app/ dir; the on-demand test APK into pr-<n>/app/).
#
# workflow_dispatch exists for the GITHUB_TOKEN gap: a run that was itself
# dispatched with GITHUB_TOKEN (release-apps → android-release) never emits
# a workflow_run completion event — the recursion guard's exemption covers
# the dispatch, not the dispatched run's own downstream events. Observed on
# three Release-apps releases (2026-08-26/27/30): the APK landed on the
# gh-pages branch and sat undeployed until the next unrelated branch event.
# android-release therefore dispatches this workflow explicitly after its
# sync (GITHUB_TOKEN workflow_dispatch IS exempt, same trick release-apps
# uses); a human-dispatched android-release fires both paths, which the
# `pages` concurrency group collapses harmlessly.

on:
  workflow_run:
    workflows:
      - "Main deploy"
      - "Preview deploy"
      - "Preview teardown"
      - "Android release"
      - "Android test APK"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; only the newest snapshot matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          # The action EXCLUDES dot-files/dirs by default (tar
          # --exclude=.[^/]*), which silently dropped .well-known/ (Digital
          # Asset Links + apple-app-site-association) from every deployment
          # even though it sat on gh-pages — found on the PR #195 preview.
          # .git/.github stay excluded regardless.
          include-hidden-files: true

      # The Pages API intermittently rejects deployments created in rapid
      # succession ("Deployment failed, try again later.") — seen in practice
      # when several preview deploys land within a minute. One retry after a
      # pause covers it; if the retry also fails, the run goes red and the
      # next branch event re-publishes anyway.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Pause before retry
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 30

      - name: Retry deploy (transient Pages API failure)
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

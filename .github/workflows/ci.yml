name: CI

# Deploy only runs on pushes to main, so without this a broken build is first
# discovered after merge — when it blocks the deploy. Check PRs instead.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the whats-new check sees commit trailers

      # Deploy-time site generation that would otherwise first break on
      # main: the What's New data must generate and be valid JSON.
      - name: Check whats-new generation
        run: python3 tools/gen-whats-new.py | python3 -m json.tool > /dev/null

      # The website and both app bundles are assembled from three separate
      # hand-maintained file lists; adding a file to one and not the others
      # ships a working site and two quietly incomplete apps.
      - name: Check bundle lists are in sync
        run: python3 tools/check-bundle-sync.py

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check wasm target (what actually deploys)
        run: cargo check --target wasm32-unknown-unknown

      # --workspace: the sim-core crate (pegasus-sim) carries its own tests
      # and a plain `cargo test` in a workspace root only runs the root
      # package's.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # Reproducible build (#214 step 5): the deployable site is a pure function
  # of the commit. Two independent checkouts at DIFFERENT paths, built by the
  # same tools/build-site.sh the deploy runs, must produce byte-identical
  # site/ trees — wasm, the stamped index.html, whats-new.json, icons, all of
  # it. Only the deploy-variable inputs (config.json, the AASA Team ID) are
  # left out; they are repository settings, not build inputs. A failure here
  # names the file that differs; the usual suspects are an unpinned tool
  # (see tools/build-wasm.sh) or a path leaking into the binary.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # whats-new.json needs the trailers
          path: build-a
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: build-b

      # Registry only — each checkout compiles into its OWN target/, which
      # is the point (a shared one would just reuse the first build).
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('build-a/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Build the site twice
        env:
          GIT_REV: ${{ github.sha }}
        run: |
          for d in build-a build-b; do
            echo "::group::$d"
            (cd "$d" && GIT_REV="${GIT_REV:0:7}" tools/build-site.sh)
            echo "::endgroup::"
          done

      - name: Compare
        run: |
          (cd build-a/site && find . -type f | sort | xargs sha256sum) > a.sum
          (cd build-b/site && find . -type f | sort | xargs sha256sum) > b.sum
          cat a.sum
          if ! diff a.sum b.sum; then
            echo "::error::site/ is not reproducible — the files above differ between two builds of the same commit"
            exit 1
          fi
          echo "Reproducible: $(wc -l < a.sum) files identical across two independent builds."

  # The in-canvas touch stick, driven end to end in a real browser: browser
  # event -> mq_js_bundle -> wasm -> the game's claim rule. Its own job so a
  # browser download doesn't slow the Rust checks. See docs/touch-input.md
  # for why this is a browser test and not an emulator one.
  touch-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The test serves the REAL wasm the deploy would ship, not a stub.
      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Install test deps
        working-directory: tests/touch-e2e
        run: |
          npm ci || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Touch regression test
        working-directory: tests/touch-e2e
        run: npm test

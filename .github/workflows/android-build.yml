# Android build check: assembles the bundle and builds a DEBUG apk on every
# PR touching the Android shell — the twin of ios-build.yml. The debug APK
# is attached as an artifact, so every PR also produces a directly
# installable build (enable "install unknown apps" on the device).
name: Android build check

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: gen-whats-new.py degrades to backfill-only on a
          # shallow clone (same rule as the web deploys).
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Assemble webroot
        env:
          # The same backend config the web deploy writes — bundled, not
          # fetched from the live site, so the build is reproducible from
          # (commit, config); see the script.
          PEGASUS_BACKEND_CONFIG: ${{ vars.BACKEND_CONFIG_JSON }}
        run: ./android/sync-web.sh

      - name: Build debug APK
        run: gradle -p android assembleDebug

      # Reproducibility (#214 step 6): the release bundle and APK must come
      # out byte-identical from a clean rebuild of the same inputs. No
      # keystore here, so both are UNSIGNED — the comparable part of a real
      # release (signing adds only META-INF/ entries and the APK signing
      # block; every other zip entry is what this checks). The webroot from
      # the step above is reused: it is an input, and the website's own
      # reproducibility job already covers it. --rerun-tasks + a wiped
      # build/ so nothing is served from a cache; a failure names the file.
      - name: Rebuild the release outputs and compare
        run: |
          gradle -p android bundleRelease assembleRelease
          mkdir -p "$RUNNER_TEMP/first"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/first/"
          rm -rf android/app/build android/build
          gradle -p android --no-build-cache --rerun-tasks bundleRelease assembleRelease
          sha256sum "$RUNNER_TEMP"/first/* \
            android/app/build/outputs/bundle/release/app-release.aab \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          cmp "$RUNNER_TEMP/first/app-release.aab" android/app/build/outputs/bundle/release/app-release.aab
          cmp "$RUNNER_TEMP/first/app-release-unsigned.apk" android/app/build/outputs/apk/release/app-release-unsigned.apk
          echo "Reproducible: the unsigned AAB and APK are byte-identical across two builds."

      - uses: actions/upload-artifact@v7
        with:
          name: pegasus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

# Build, sign and upload the iOS app to TestFlight.
#
# Runs on MANUAL DISPATCH ONLY (Actions → iOS TestFlight → Run workflow).
# Automatic publishing on every main push is PAUSED (owner request, 2026-08);
# the commented-out push trigger below — including its hard-won paths-ignore
# rationale — is kept intact so resuming is just uncommenting it.
#
# If two builds land inside Apple's Beta App Review window the second gets
# ANOTHER_BUILD_IN_REVIEW; testflight-distribute.py treats that as a soft
# notice and carries on, so the run stays green and the next build
# supersedes it.
#
# Signing is xcodebuild "cloud signing": the App Store Connect API key lets
# xcodebuild create/fetch the distribution certificate and provisioning
# profile itself — no certificates or profiles are stored in the repo.
#
# Required repository secrets:
#   APP_STORE_CONNECT_API_KEY_ID      the key's 10-char Key ID
#   APP_STORE_CONNECT_API_ISSUER_ID   the team's Issuer ID (UUID)
#   APP_STORE_CONNECT_API_KEY_P8      the .p8 file contents
#   APPLE_TEAM_ID                     10-char Team ID (developer.apple.com →
#                                     Membership details)
#
# The App Store Connect app record for the bundle id must exist before the
# first upload. CFBundleVersion = the workflow run number (monotonic), so
# every upload is a new build; the marketing version stays whatever the
# project sets.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: >-
          Where the build goes after Apple's processing. public-beta =
          hands-free Beta App Review + the public beta group (the normal
          release path). internal-only = upload and STOP: the build reaches
          internal testers (App Store Connect users) only — no review, no
          external group — for testing a work-in-progress branch build.
        type: choice
        options:
          - public-beta
          - internal-only
        default: public-beta
  # Push trigger PAUSED — restore by uncommenting this block verbatim.
  # push:
  #   branches: [main]
  #   # INVERTED ON PURPOSE — do not "tidy" this back into a paths: allowlist.
  #   # The app bundles the whole web build, so ios/ holds only the SHELL: a
  #   # change to src/, index.html, mq_js_bundle.js or levels/ changes what
  #   # ships to a device just as much as a Swift change. The old
  #   # ios/**-only filter meant game fixes reached the website and left both
  #   # apps frozen — the 2026-07 Android touch fix shipped only because its
  #   # PR happened to also touch android/. An allowlist has to be remembered
  #   # every time a file is added; this fails OPEN instead, so the worst case
  #   # is one wasted build rather than a silently stale app.
  #   paths-ignore:
  #     - "docs/**"
  #     - "tests/**"
  #     - "**.md"
  #     # Workflows that cannot change what lands on a device. NOT the whole
  #     # of .github/: this workflow's OWN file must stay unignored so a fix
  #     # to it is exercised by the next merge — that is how the Android
  #     # release's `secrets in step if:` fix was verified (03e67a8, a
  #     # commit touching nothing else). Forgetting to list a NEW workflow
  #     # here costs one wasted build, which is the safe direction.
  #     - ".github/workflows/ci.yml"
  #     - ".github/workflows/deploy.yml"
  #     - ".github/workflows/preview-*.yml"
  #     - ".github/workflows/publish-pages.yml"
  #     - ".github/workflows/android-*.yml"
  #     - ".github/workflows/ios-build.yml"
  #     - ".github/workflows/release-apps.yml"
  #     - ".github/actions/**"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::missing secret behind $v"; missing=1; fi
          done
          if [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}" ]; then
            echo "::error::missing secret APP_STORE_CONNECT_API_KEY_P8"; missing=1
          fi
          exit $missing

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          echo "Selected $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ios-

      - name: Install wasm-opt
        run: brew install binaryen

      - name: Assemble WebRoot
        run: ./ios/sync-web.sh

      - name: Write API key
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_"$ASC_KEY_ID".p8
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      # Every archive on a fresh runner mints a NEW Apple Development
      # certificate (the previous one's private key died with its ephemeral
      # runner), so dead certs accumulate until Apple's account cap breaks
      # every archive ("maximum number of certificates" — seen live 2026-08).
      # Revoke them before archiving; best-effort, warnings never fail the
      # build. See ios/asc-cleanup-certs.py for the full story.
      - name: Revoke stale development certificates
        run: |
          python3 -m pip install --quiet --user PyJWT cryptography \
            || python3 -m pip install --quiet --break-system-packages PyJWT cryptography
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          python3 ios/asc-cleanup-certs.py

      - name: Archive
        run: |
          xcodebuild \
            -project ios/Pegasus.xcodeproj \
            -scheme Pegasus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Pegasus.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Upload to TestFlight
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/Pegasus.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      # Hands-free distribution: wait for Apple to process the build, submit
      # it to Beta App Review, and attach it to the beta group so testers
      # (incl. the public link) get it with zero console clicks. The group
      # name comes from the TESTFLIGHT_GROUP_NAME repo variable (default
      # "Public beta"); a group that doesn't exist yet is a soft no-op.
      # SKIPPED for internal-only dispatches: the plain upload already
      # reaches internal testers once Apple finishes processing — no Beta
      # App Review, no external group, nothing to clean up (the next
      # public-beta build simply supersedes it). The condition reads as
      # "not explicitly internal-only" so a future re-enabled push trigger
      # (no inputs) keeps the public path.
      - name: Assign build to TestFlight group
        if: ${{ inputs.distribution != 'internal-only' }}
        env:
          BUNDLE_ID: se.danielfalk.pegasus
          BUILD_VERSION: ${{ github.run_number }}
          GROUP_NAME: ${{ vars.TESTFLIGHT_GROUP_NAME || 'Public beta' }}
        run: |
          python3 -m pip install --quiet --user PyJWT cryptography \
            || python3 -m pip install --quiet --break-system-packages PyJWT cryptography
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          python3 ios/testflight-distribute.py

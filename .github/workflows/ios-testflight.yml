# Build, sign and upload the iOS app to TestFlight.
#
# Runs on MANUAL DISPATCH ONLY (Actions → iOS TestFlight → Run workflow).
# Automatic publishing on every main push is PAUSED (owner request, 2026-08);
# the commented-out push trigger below — including its hard-won paths-ignore
# rationale — is kept intact so resuming is just uncommenting it.
#
# INTERNAL BY DEFAULT (owner decision 2026-09, after the first App Store
# release): a run uploads the build and stops there. Uploaded builds reach
# the INTERNAL TestFlight testers on their own (an internal group with
# "automatic distribution" enabled needs no Beta App Review and no console
# click); promoting a build to external testing — Beta App Review + the
# external beta group — is a deliberate step the owner takes in App Store
# Connect, or by re-running this workflow with the `external` input ticked,
# which runs testflight-distribute.py exactly as it always did.
#
# If two builds land inside Apple's Beta App Review window the second gets
# ANOTHER_BUILD_IN_REVIEW; testflight-distribute.py treats that as a soft
# notice and carries on, so the run stays green and the next build
# supersedes it.
#
# Signing is xcodebuild "cloud signing": the App Store Connect API key lets
# xcodebuild create/fetch the distribution certificate and provisioning
# profile itself — no certificates or profiles are stored in the repo.
#
# Required repository secrets:
#   APP_STORE_CONNECT_API_KEY_ID      the key's 10-char Key ID
#   APP_STORE_CONNECT_API_ISSUER_ID   the team's Issuer ID (UUID)
#   APP_STORE_CONNECT_API_KEY_P8      the .p8 file contents
#   APPLE_TEAM_ID                     10-char Team ID (developer.apple.com →
#                                     Membership details)
#
# The App Store Connect app record for the bundle id must exist before the
# first upload. CFBundleVersion = the workflow run number (monotonic), so
# every upload is a new build; the marketing version stays whatever the
# project sets.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      external:
        description: "Also attach the build to a beta group (Beta App Review first when the group is external; default: internal TestFlight only)"
        type: boolean
        default: false
      group:
        description: "Beta group to attach to (needs `external`); empty = the TESTFLIGHT_GROUP_NAME repo variable, else \"Public beta\""
        type: string
        default: ""
      marketing_version:
        description: "Override the tag-derived marketing version (a branch build whose nearest tag is an already-approved train); empty = tools/version.sh --marketing"
        type: string
        default: ""
  # Push trigger PAUSED — restore by uncommenting this block verbatim.
  # push:
  #   branches: [main]
  #   # INVERTED ON PURPOSE — do not "tidy" this back into a paths: allowlist.
  #   # The app bundles the whole web build, so ios/ holds only the SHELL: a
  #   # change to src/, index.html, mq_js_bundle.js or levels/ changes what
  #   # ships to a device just as much as a Swift change. The old
  #   # ios/**-only filter meant game fixes reached the website and left both
  #   # apps frozen — the 2026-07 Android touch fix shipped only because its
  #   # PR happened to also touch android/. An allowlist has to be remembered
  #   # every time a file is added; this fails OPEN instead, so the worst case
  #   # is one wasted build rather than a silently stale app.
  #   paths-ignore:
  #     - "docs/**"
  #     - "tests/**"
  #     - "**.md"
  #     # Workflows that cannot change what lands on a device. NOT the whole
  #     # of .github/: this workflow's OWN file must stay unignored so a fix
  #     # to it is exercised by the next merge — that is how the Android
  #     # release's `secrets in step if:` fix was verified (03e67a8, a
  #     # commit touching nothing else). Forgetting to list a NEW workflow
  #     # here costs one wasted build, which is the safe direction.
  #     - ".github/workflows/ci.yml"
  #     - ".github/workflows/deploy.yml"
  #     - ".github/workflows/preview-*.yml"
  #     - ".github/workflows/publish-pages.yml"
  #     - ".github/workflows/android-*.yml"
  #     - ".github/workflows/ios-build.yml"
  #     - ".github/workflows/release-apps.yml"
  #     - ".github/actions/**"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # sign the provenance attestation (Sigstore, via GitHub's OIDC)
  attestations: write # store it in the repo's attestation registry

jobs:
  upload:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::missing secret behind $v"; missing=1; fi
          done
          if [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}" ]; then
            echo "::error::missing secret APP_STORE_CONNECT_API_KEY_P8"; missing=1
          fi
          exit $missing

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          echo "Selected $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Install Rust
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ios-

      - name: Derive the marketing version from the release tag
        # CFBundleShortVersionString = the tag (tools/version.sh --marketing);
        # the run FAILS on an untagged history — a store release is cut from
        # a tagged main (CLAUDE.md "Versioning"). The build number stays the
        # run number (CURRENT_PROJECT_VERSION below). The `marketing_version`
        # input overrides it for a one-off BRANCH build: Apple closes a
        # train once that version is approved on the App Store ("Invalid
        # Pre-Release Train", seen live 2026-09 on a PR build whose nearest
        # tag was the shipped v1.0.1), so a pre-tag TestFlight build of the
        # next cycle names that cycle's number here (the tag on main comes
        # later, with the cycle's first beta from main — CLAUDE.md).
        run: |
          if [ -n "${{ inputs.marketing_version }}" ]; then
            echo "MARKETING_VERSION=${{ inputs.marketing_version }}" >> "$GITHUB_ENV"
          else
            echo "MARKETING_VERSION=$(tools/version.sh --marketing)" >> "$GITHUB_ENV"
          fi

      - name: Assemble WebRoot
        env:
          # The same backend config the web deploy writes — bundled, not
          # fetched from the live site, so the build is reproducible from
          # (commit, config); see the script.
          PEGASUS_BACKEND_CONFIG: ${{ vars.BACKEND_CONFIG_JSON }}
        run: ./ios/sync-web.sh

      - name: Write API key
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_"$ASC_KEY_ID".p8
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      # Every archive on a fresh runner mints a NEW Apple Development
      # certificate (the previous one's private key died with its ephemeral
      # runner), so dead certs accumulate until Apple's account cap breaks
      # every archive ("maximum number of certificates" — seen live 2026-08).
      # Revoke them before archiving; best-effort, warnings never fail the
      # build. See ios/asc-cleanup-certs.py for the full story.
      - name: Revoke stale development certificates
        run: |
          python3 -m pip install --quiet --user PyJWT cryptography \
            || python3 -m pip install --quiet --break-system-packages PyJWT cryptography
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          python3 ios/asc-cleanup-certs.py

      - name: Archive
        run: |
          xcodebuild \
            -project ios/Pegasus.xcodeproj \
            -scheme Pegasus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Pegasus.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Upload to TestFlight
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/Pegasus.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      # OPT-IN group distribution (the `external` input; off by default —
      # see the header): wait for Apple to process the build and attach it
      # to the beta group so its testers get it with zero console clicks —
      # Beta App Review first when the group is EXTERNAL (the script reads
      # the group's isInternalGroup; an internal group such as a named alpha
      # circle needs no review and gets none). The group is the `group`
      # input (a one-off dispatch to a specific circle), else the
      # TESTFLIGHT_GROUP_NAME repo variable (default "Public beta"); a group
      # that doesn't exist yet is a soft no-op. A run dispatched by
      # release-apps.yml or a tag push leaves the input at its default, so
      # those releases stop at internal testing.
      - name: Assign the beta group (Beta App Review first for an external one)
        if: ${{ inputs.external == true }}
        env:
          BUNDLE_ID: se.danielfalk.pegasus
          BUILD_VERSION: ${{ github.run_number }}
          GROUP_NAME: ${{ inputs.group || vars.TESTFLIGHT_GROUP_NAME || 'Public beta' }}
        run: |
          python3 -m pip install --quiet --user PyJWT cryptography \
            || python3 -m pip install --quiet --break-system-packages PyJWT cryptography
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          python3 ios/testflight-distribute.py

      # Provenance (#214 step 7), the honest iOS version: the IPA itself is
      # never in anyone's hands (Apple re-signs and TestFlight/App Store
      # installs are not downloadable), so what gets attested is the
      # archive's payload — the app executable and the bundled game wasm.
      # Export re-signs the executable (its signature blob changes), but
      # the wasm goes to Apple byte for byte, and it is the SAME bytes the
      # website serves for this commit (tools/build-wasm.sh): verifying a
      # local build of the wasm against the attestations shows which iOS
      # build numbers shipped it. Last on purpose — an attestation hiccup
      # must never hold back an upload that already happened.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/Pegasus.xcarchive/Products/Applications/Pegasus.app/Pegasus
            build/Pegasus.xcarchive/Products/Applications/Pegasus.app/WebRoot/pegasus.wasm

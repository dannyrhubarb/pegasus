name: Build site
description: >
  Build the WASM release and assemble the deployable site into site/ —
  shared by the main deploy and the per-PR preview deploy. The recipe itself
  is tools/build-site.sh (one script, so ci.yml's reproducibility check runs
  exactly what deploys); this action only adds the cargo cache around it.
inputs:
  revision:
    description: Revision label injected into the info overlay (__GIT_REVISION__).
    required: true
  backend-config:
    description: >
      JSON for site/config.json ({"apiBaseUrl": …, "replayBaseUrl": …, and
      optionally "wsUrl" for the multiplayer signaling WebSocket} — the
      pegasus-backend stack's FrontendConfigJson output, stored in the
      BACKEND_CONFIG_JSON repo variable). Empty = no config.json is written
      and the game runs with online scores disabled; no wsUrl = multiplayer
      hidden.
    required: false
    default: ""
  apple-team-id:
    description: >
      Apple Developer Team ID (the APPLE_TEAM_ID repo secret). Stamped into
      .well-known/apple-app-site-association's appIDs so Universal Links
      verify for the iOS app. Empty = the placeholder file is removed and the
      site ships no AASA (forks / local builds have no app to link to).
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The toolchain (and the wasm target) come from rust-toolchain.toml —
    # rustup installs the pinned version on the first cargo call.
    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/build-wasm.sh') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Build site
      shell: bash
      env:
        GIT_REV: ${{ inputs.revision }}
        BACKEND_CONFIG: ${{ inputs.backend-config }}
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
      run: tools/build-site.sh
